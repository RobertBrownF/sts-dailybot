name: Run StS Daily Bot

on:
  schedule:
    - cron: '0 6 * * *' # Автоматический запуск каждый день в 06:00 UTC
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SPIRE_CODEX_API_KEY: ${{ secrets.SPIRE_CODEX_API_KEY }}
        run: python bot.py
